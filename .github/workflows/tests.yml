#
# FR : Tests automatiques sur GitHub. À chaque « git push », GitHub lance les
#      tests de RuneCast sur trois systèmes en même temps : Windows, Ubuntu et
#      Fedora 44. Le résultat s'affiche par une coche verte (tout va bien) ou
#      une croix rouge (un test a échoué) à côté de chaque envoi.
# EN : Automatic tests on GitHub. On every "git push", GitHub runs the RuneCast
#      tests on three systems at once: Windows, Ubuntu and Fedora 44. The result
#      shows as a green check mark (all good) or a red cross (a test failed)
#      next to each push.

name: Tests

on:
  # FR : à chaque envoi sur la branche principale / EN : on every push to main
  push:
    branches: [main]
  # FR : sur chaque proposition de modification / EN : on every pull request
  pull_request:
  # FR : bouton « Run workflow » pour relancer à la main / EN : manual re-run button
  workflow_dispatch:

# FR : Les tests n'ont besoin que de lire le code. EN : Tests only need to read the code.
permissions:
  contents: read

# FR : Si un nouvel envoi arrive, on annule les tests de l'envoi précédent.
# EN : If a new push arrives, the tests of the previous push are cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # FR : Windows et Ubuntu (machines fournies par GitHub)
  # EN : Windows and Ubuntu (machines provided by GitHub)
  # ------------------------------------------------------------------
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # FR : un échec sur un système n'arrête pas les autres
      # EN : a failure on one system does not stop the others
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Récupérer le code / Get the code
        uses: actions/checkout@v7

      - name: Installer uv / Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Bibliothèques de Qt pour Linux / Qt libraries for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Installer RuneCast et ses outils / Install RuneCast and its tools
        run: uv sync --locked

      - name: Qualité du code / Code quality
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests automatiques / Automatic tests
        run: uv run pytest

      - name: Démarrage en ligne de commande / Command-line start
        run: uv run runecast --version

  # ------------------------------------------------------------------
  # FR : Fedora 44, ta distribution de référence, dans un conteneur
  # EN : Fedora 44, your reference distribution, in a container
  # ------------------------------------------------------------------
  fedora:
    name: Tests (fedora-44)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:44
    steps:
      - name: Paquets Fedora / Fedora packages
        run: |
          dnf install -y git uv python3.13 mesa-libEGL mesa-libGL libxkbcommon \
            libxkbcommon-x11 fontconfig dejavu-sans-fonts dbus-libs glib2

      - name: Récupérer le code / Get the code
        uses: actions/checkout@v7

      - name: Installer RuneCast et ses outils / Install RuneCast and its tools
        run: uv sync --locked

      - name: Tests automatiques / Automatic tests
        run: uv run pytest

      - name: Démarrage en ligne de commande / Command-line start
        run: uv run runecast --version
